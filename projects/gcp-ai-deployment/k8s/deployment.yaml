apiVersion: apps/v1
kind: Deployment
metadata:
  name: gcp-ai-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gcp-ai-api
  template:
    metadata:
      labels:
        app: gcp-ai-api
    spec:
      serviceAccountName: gcp-ai-api
      containers:
        - name: api
          image: us-central1-docker.pkg.dev/PROJECT_ID/ai-apps/gcp-ai-api:latest
          ports:
            - containerPort: 8080
          env:
            - name: GOOGLE_CLOUD_PROJECT
              value: PROJECT_ID
            - name: GOOGLE_CLOUD_LOCATION
              value: us-central1
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
