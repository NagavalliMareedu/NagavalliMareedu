name: Test, Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - "projects/gcp-ai-deployment/**"
  pull_request:
    paths:
      - "projects/gcp-ai-deployment/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_DIR: projects/gcp-ai-deployment
  REGION: us-central1
  SERVICE: gcp-ai-api
  REPOSITORY: ai-apps

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: projects/gcp-ai-deployment/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check app tests
      - run: pytest -q

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - name: Build and push
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${REPOSITORY}/${SERVICE}:${GITHUB_SHA}"
          docker build -t "${IMAGE}" "${PROJECT_DIR}"
          docker push "${IMAGE}"
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${SERVICE}"             --image "${IMAGE}"             --project "${{ secrets.GCP_PROJECT_ID }}"             --region "${REGION}"             --service-account "gcp-ai-runtime@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com"             --quiet
